name: openscp
title: OpenSCP
base: core24
version: "1.0.0"
summary: Lightweight two-panel client for remote file transfers
description: |
  OpenSCP is a lightweight, two-panel client for remote file transfers.
  This snap includes SFTP and SCP support.
license: GPL-3.0-only
website:
  - https://github.com/luiscuellar31/openscp
source-code:
  - https://github.com/luiscuellar31/openscp
issues:
  - https://github.com/luiscuellar31/openscp/issues
contact:
  - luiscuellar31@proton.me
grade: stable
confinement: strict
icon: icon.png

apps:
  openscp:
    command: usr/bin/openscp
    desktop: usr/share/applications/openscp-snap.desktop
    extensions: [kde-neon-6]
    plugs:
      - home
      - network
      - network-bind
      - removable-media
      - password-manager-service

parts:
  openscp:
    plugin: cmake
    source: ../..
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DOPENSCP_ENABLE_FTP_BACKEND=OFF
      - -DOPENSCP_ENABLE_WEBDAV_BACKEND=OFF
    build-packages:
      - g++
      - pkg-config
      - libssh2-1-dev
      - libssl-dev
      - libsecret-1-dev
    stage-packages:
      - libssh2-1
      - libsecret-1-0
    override-build: |
      craftctl default
      install -Dm644 "${CRAFT_PROJECT_DIR}/openscp-snap.desktop" \
        "${CRAFT_PART_INSTALL}/usr/share/applications/openscp-snap.desktop"
    override-prime: |
      craftctl default
      "${CRAFT_PROJECT_DIR}/../../scripts/verify/qt-svg-plugins.sh" \
        --allow-runtime-provided \
        --context snap \
        "${CRAFT_PRIME}"
