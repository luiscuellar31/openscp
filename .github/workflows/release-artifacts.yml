name: Release Artifacts (Main Preflight + Tag Publish)

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OPENSCP_QT_VERSION: "6.11.2"
  OPENSCP_UPDATE_PUBLIC_KEY: ${{ vars.OPENSCP_UPDATE_PUBLIC_KEY }}
  OPENSCP_SPARKLE_PUBLIC_KEY: ${{ vars.OPENSCP_SPARKLE_PUBLIC_KEY }}

jobs:
  verify-source:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      tag_commit: ${{ steps.meta.outputs.tag_commit }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify update-manifest signing with disposable keys
        run: python3 scripts/checks/update-signing.py

      - name: Validate version and tag when present
        id: meta
        run: |
          set -euo pipefail

          version="$(sed -n 's/^project(.*VERSION[[:space:]]*\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)"
          if [[ -z "$version" ]]; then
            echo "Could not detect project version from CMakeLists.txt"
            exit 1
          fi
          snap_version="$(sed -n 's/^version:[[:space:]]*"\([0-9][0-9.]*\)"[[:space:]]*$/\1/p' packaging/snap/snapcraft.yaml | head -n1)"
          if [[ "$snap_version" != "$version" ]]; then
            echo "Version source mismatch: CMake=${version}, Snap=${snap_version:-missing}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          case "$GITHUB_REF" in
            refs/heads/main)
              ;;
            refs/tags/v*)
              tag="$GITHUB_REF_NAME"
              if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
                echo "Invalid tag format: '$tag' (expected: vX.Y.Z)"
                exit 1
              fi

              git fetch --no-tags origin main
              commit="$(git rev-list -n1 "$tag")"
              if ! git merge-base --is-ancestor "$commit" origin/main; then
                echo "Tag commit is not contained in origin/main: $commit"
                exit 1
              fi
              if [[ "v${version}" != "$tag" ]]; then
                echo "Tag/version mismatch: tag=${tag}, project=v${version}"
                exit 1
              fi

              echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
              echo "tag_commit=${commit}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported release source: $GITHUB_REF"
              exit 1
              ;;
          esac

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs:
      - verify-source
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            minimum_macos: "13.0"
          - runner: macos-15-intel
            arch: x86_64
            minimum_macos: "13.0"

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify pinned Xcode
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          clang++ --version

      - name: Install pinned Qt release SDK
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.OPENSCP_QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true
          aqtversion: "==3.3.0"
          py7zrversion: "==1.1.0"

      - name: Install macOS build tools
        run: |
          brew install pkg-config openssl@3
          echo "OPENSSL_BIN=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"

      - name: Build pinned macOS dependencies for the deployment target
        env:
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.minimum_macos }}
        run: |
          set -euo pipefail
          deps_prefix="$RUNNER_TEMP/openscp-release-deps"
          ./scripts/ci/build_macos_release_deps.sh "$deps_prefix"
          echo "OPENSCP_DEPENDENCY_PREFIX=$deps_prefix" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$deps_prefix" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$deps_prefix:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$deps_prefix/lib/pkgconfig:$deps_prefix/lib64/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Configure signed macOS updates when a public key is available
        run: |
          set -euo pipefail
          if [[ -n "$OPENSCP_SPARKLE_PUBLIC_KEY" ]]; then
            sdk="$RUNNER_TEMP/sparkle"
            bash ./scripts/ci/fetch_sparkle.sh "$sdk"
            echo "OPENSCP_ENABLE_SPARKLE=ON" >> "$GITHUB_ENV"
            echo "OPENSCP_SPARKLE_FRAMEWORK=$sdk/Sparkle.framework" >> "$GITHUB_ENV"
            echo "OPENSCP_SPARKLE_FEED_URL=https://github.com/luiscuellar31/openscp/releases/latest/download/appcast-${{ matrix.arch }}.xml" >> "$GITHUB_ENV"
          fi

      - name: Build macOS release artifacts
        run: |
          rm -rf dist build-macos-package
          SKIP_CODESIGN=1 \
          SKIP_NOTARIZATION=1 \
          DO_ADHOC_SIGN=1 \
          MACDEPLOYQT_DISABLE_PLUGIN_SCAN=1 \
          PACKAGE_FORMATS=app,dmg \
          OPENSCP_ENFORCE_RECOMMENDED_QT_VERSION=ON \
          MINIMUM_SYSTEM_VERSION="${{ matrix.minimum_macos }}" \
          CMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
          QT_PREFIX="$QT_ROOT_DIR" \
          Qt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6" \
          ./scripts/package/macos.sh

      - name: Verify macOS bundle linkage
        run: |
          MAX_BUNDLE_SIZE_MIB=80 \
            bash ./scripts/verify/macos-bundle.sh build-macos-package/OpenSCP.app

      - name: Collect macOS artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          files=(
            dist/*-${{ matrix.arch }}-UNSIGNED.zip
            dist/*-${{ matrix.arch }}-UNSIGNED.zip.sha256
            dist/*-${{ matrix.arch }}-UNSIGNED.dmg
            dist/*-${{ matrix.arch }}-UNSIGNED.dmg.sha256
          )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No macOS artifacts found for arch ${{ matrix.arch }}"
            ls -la dist || true
            exit 1
          fi
          cp "${files[@]}" out/
          ls -lah out

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  # The Sparkle key signs on a fresh VM that only fetches the pinned Sparkle
  # tools, never on one that installed Homebrew and PyPI packages or ran the
  # build.
  sign-macos-updates:
    name: Sign macOS update appcasts
    if: startsWith(github.ref, 'refs/tags/v') && vars.OPENSCP_SPARKLE_PUBLIC_KEY != ''
    needs:
      - verify-source
      - build-macos
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch pinned Sparkle tools
        run: bash ./scripts/ci/fetch_sparkle.sh "$RUNNER_TEMP/sparkle"

      # The appcast check verifies Ed25519 signatures with OpenSSL 3. The
      # system openssl is LibreSSL, which cannot, so use the runner's
      # preinstalled Homebrew build; nothing is installed here.
      - name: Use the runner's OpenSSL 3
        run: |
          set -euo pipefail
          openssl_bin="$(brew --prefix openssl@3)/bin/openssl"
          "$openssl_bin" version
          echo "OPENSSL_BIN=$openssl_bin" >> "$GITHUB_ENV"

      - name: Download macOS archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-*
          path: macos-assets

      - name: Sign update appcasts
        env:
          OPENSCP_SPARKLE_PRIVATE_KEY: ${{ secrets.OPENSCP_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="${{ needs.verify-source.outputs.version }}"
          mkdir -p out
          for arch in arm64 x86_64; do
            bash ./scripts/release/sparkle-appcast.sh \
              "$RUNNER_TEMP/sparkle" \
              "macos-assets/macos-${arch}/OpenSCP-${version}-${arch}-UNSIGNED.zip" \
              "$version" \
              "out/appcast-${arch}.xml"
          done

      - name: Upload appcasts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-appcasts
          path: out/*
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.arch_name }})
    needs:
      - verify-source
    env:
      APPIMAGE_UPDATE_INFORMATION: gh-releases-zsync|luiscuellar31|openscp|latest|OpenSCP-*-${{ matrix.arch_name }}.AppImage.zsync
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch_name: x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
          - runner: ubuntu-24.04-arm
            arch_name: aarch64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Python 3.12 can misidentify Qt's ARM qttools .7z as a ZIP because of
      # embedded ZIP signatures. Python 3.14 validates the ZIP directory first.
      - name: Install pinned Python for the Qt installer
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Install pinned Qt release SDK
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.OPENSCP_QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true
          setup-python: false
          aqtversion: "==3.3.0"
          py7zrversion: "==1.1.0"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config curl file \
            libssh2-1-dev libssl-dev libcurl4-openssl-dev libtinyxml2-dev libsecret-1-dev \
            libgl1-mesa-dev \
            flatpak flatpak-builder \
            squashfs-tools

      - name: Install AppImage tools
        run: |
          set -euo pipefail
          # Pin immutable releases so the reviewed digests cannot change under us.
          linuxdeploy_version="1-alpha-20251107-1"
          qt_plugin_version="1-alpha-20250213-1"
          appimagetool_version="1.9.1"
          arch="$(uname -m)"
          case "$arch" in
            x86_64)
              appimg_arch="x86_64"
              linuxdeploy_sha="c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
              qt_plugin_sha="15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724"
              appimagetool_sha="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
              ;;
            aarch64|arm64)
              appimg_arch="aarch64"
              linuxdeploy_sha="620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff"
              qt_plugin_sha="bf1c24aff6d749b5cf423afad6f15abd4440f81dec1aab95706b25f6667cdcf1"
              appimagetool_sha="f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158"
              ;;
            *)
              echo "Unsupported Linux arch for AppImage tools: $arch"
              exit 1
              ;;
          esac

          mkdir -p "$HOME/.local/bin"
          curl -fL "https://github.com/linuxdeploy/linuxdeploy/releases/download/${linuxdeploy_version}/linuxdeploy-${appimg_arch}.AppImage" \
            -o "$HOME/.local/bin/linuxdeploy"
          curl -fL "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${qt_plugin_version}/linuxdeploy-plugin-qt-${appimg_arch}.AppImage" \
            -o "$HOME/.local/bin/linuxdeploy-plugin-qt"
          curl -fL "https://github.com/AppImage/appimagetool/releases/download/${appimagetool_version}/appimagetool-${appimg_arch}.AppImage" \
            -o "$HOME/.local/bin/appimagetool"
          echo "${linuxdeploy_sha}  $HOME/.local/bin/linuxdeploy" | sha256sum --check --strict
          echo "${qt_plugin_sha}  $HOME/.local/bin/linuxdeploy-plugin-qt" | sha256sum --check --strict
          echo "${appimagetool_sha}  $HOME/.local/bin/appimagetool" | sha256sum --check --strict
          chmod +x "$HOME/.local/bin/linuxdeploy" \
                   "$HOME/.local/bin/linuxdeploy-plugin-qt" \
                   "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Snapcraft
        run: |
          if ! command -v snap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y snapd
            sudo systemctl start snapd.socket || true
            sudo systemctl start snapd || true
          fi
          if snap list snapcraft >/dev/null 2>&1; then
            sudo snap refresh snapcraft || true
          else
            sudo snap install snapcraft --classic
          fi

      - name: Setup Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build AppImage (glibc 2.34 baseline)
        if: matrix.arch_name == 'x86_64'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          OPENSCP_ENFORCE_RECOMMENDED_QT_VERSION: "ON"
        run: |
          set -euo pipefail
          rm -rf dist build build-appimage
          docker build --platform linux/amd64 \
            --tag openscp-appimage-glibc234 \
            --file packaging/linux/appimage-glibc234.Dockerfile \
            packaging/linux
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$QT_ROOT_DIR:$QT_ROOT_DIR:ro" \
            --volume "$HOME/.local/bin:$HOME/.local/bin:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            --env APPIMAGE_EXTRACT_AND_RUN=1 \
            --env APPIMAGE_UPDATE_INFORMATION \
            --env OPENSCP_UPDATE_PUBLIC_KEY \
            --env OPENSCP_ENFORCE_RECOMMENDED_QT_VERSION=ON \
            --env OPENSCP_MAX_GLIBC_VERSION=2.34 \
            --env "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH:-}" \
            --env "Qt6_DIR=${Qt6_DIR:-}" \
            --env "PATH=$QT_ROOT_DIR/bin:$HOME/.local/bin:/opt/rh/gcc-toolset-13/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            openscp-appimage-glibc234 \
            ./scripts/package/appimage.sh
          sudo chown -R "$(id -u):$(id -g)" build-appimage dist

      - name: Build AppImage (Ubuntu 24.04 arm64 baseline)
        if: matrix.arch_name == 'aarch64'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          OPENSCP_ENFORCE_RECOMMENDED_QT_VERSION: "ON"
          OPENSCP_MAX_GLIBC_VERSION: "2.39"
        run: |
          rm -rf dist build build-appimage
          ./scripts/package/appimage.sh

      - name: Build Snap
        run: |
          sudo env "PATH=$PATH" ./scripts/package/snap.sh --destructive-mode

      - name: Build Flatpak
        run: |
          rm -rf dist/flatpak
          ./scripts/package/flatpak.sh --user --install-deps-from=flathub

      - name: Collect Linux artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          arch="$(uname -m)"

          shopt -s nullglob
          appimage_files=(dist/*.AppImage dist/*.AppImage.zsync dist/*.AppImage.sha256)
          snap_files=(packaging/snap/*.snap)
          if [[ ${#appimage_files[@]} -gt 0 ]]; then
            cp "${appimage_files[@]}" out/
          fi
          if [[ ${#snap_files[@]} -gt 0 ]]; then
            cp "${snap_files[@]}" out/
          fi

          if [[ -f dist/OpenSCP.flatpak ]]; then
            mv dist/OpenSCP.flatpak "out/OpenSCP-${arch}.flatpak"
          fi

          if ! compgen -G "out/*" > /dev/null; then
            echo "No Linux artifacts produced."
            ls -la dist || true
            ls -la packaging/snap || true
            exit 1
          fi

          for f in out/*; do
            [[ "$f" == *.sha256 ]] && continue
            sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
          done

          ls -lah out

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch_name }}
          path: out/*
          if-no-files-found: error

  build-windows:
    name: Build Windows (x64)
    needs:
      - verify-source
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # aqtinstall 3.3.0 does not find Qt 6.11 for Windows in the current
      # repository layout; this commit of its main branch does.
      - name: Install pinned Qt release SDK
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.OPENSCP_QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          py7zrversion: "==1.1.0"

      - name: Fetch vcpkg at the manifest baseline
        id: vcpkg
        shell: pwsh
        run: .\scripts\ci\fetch_vcpkg.ps1

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\vcpkg-archives
          key: vcpkg-x64-windows-static-md-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}-${{ steps.vcpkg.outputs.msvc }}
          restore-keys: |
            vcpkg-x64-windows-static-md-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}-
            vcpkg-x64-windows-static-md-

      - name: Install pinned Inno Setup and WiX
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          curl.exe --fail --location --proto '=https' --silent --show-error `
            --output $installer `
            https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant() -ne $expected) {
            throw 'The Inno Setup installer does not match its pinned SHA-256.'
          }
          $innoDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $install = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER',
            "/DIR=`"$innoDir`"")
          if ($install.ExitCode -ne 0) { throw "Inno Setup did not install: $($install.ExitCode)" }
          "ISCC=$(Join-Path $innoDir 'ISCC.exe')" >> $env:GITHUB_ENV
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $env:USERPROFILE '.dotnet\tools' >> $env:GITHUB_PATH
          # By its path: the runner's WiX v3 sets WIX to its own folder.
          "OPENSCP_WIX=$(Join-Path $env:USERPROFILE '.dotnet\tools\wix.exe')" >> $env:GITHUB_ENV

      - name: Build the setup and the MSI
        shell: pwsh
        env:
          QT_PREFIX: ${{ env.QT_ROOT_DIR }}
          OPENSCP_ENFORCE_RECOMMENDED_QT_VERSION: "ON"
        run: .\scripts\package\windows.ps1

      # OpenSCP closes at once when a DLL or plugin is missing, so it must
      # still run after a few seconds; then the uninstaller must clean up.
      - name: Smoke-test the setup
        shell: pwsh
        run: |
          $version = '${{ needs.verify-source.outputs.version }}'
          $log = Join-Path $env:RUNNER_TEMP 'setup.log'
          $installer = (Resolve-Path "dist\OpenSCP-$version-x64-setup.exe").Path
          $setup = Start-Process -FilePath $installer -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/LOG=`"$log`""
          if ($setup.ExitCode -ne 0) { Get-Content $log; throw "The setup exited with $($setup.ExitCode)." }
          $folder = Join-Path $env:LOCALAPPDATA 'Programs\OpenSCP'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{2C03B5C3-87DD-4DAB-B609-F89E831909E6}_is1'
          if ((Get-ItemProperty $key).InstallLocation.TrimEnd('\') -ne $folder) {
            throw 'The setup did not record the installation where OpenSCP looks for it.'
          }
          $app = Start-Process -FilePath (Join-Path $folder 'OpenSCP.exe') -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "OpenSCP exited at start with $($app.ExitCode)." }
          Stop-Process -Id $app.Id -Force
          Start-Process -FilePath (Join-Path $folder 'unins000.exe') -Wait `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $deadline = (Get-Date).AddSeconds(60)
          while (((Test-Path $folder) -or (Test-Path $key)) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
          }
          if ((Test-Path $folder) -or (Test-Path $key)) { throw 'The uninstaller left OpenSCP behind.' }

      - name: Smoke-test the MSI
        shell: pwsh
        run: |
          $version = '${{ needs.verify-source.outputs.version }}'
          $msi = (Resolve-Path "dist\OpenSCP-$version-x64.msi").Path
          $log = Join-Path $env:RUNNER_TEMP 'msi.log'
          $install = Start-Process -FilePath msiexec.exe -Wait -PassThru `
            -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$log`""
          if ($install.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "The MSI exited with $($install.ExitCode)." }
          $exe = Join-Path $env:ProgramFiles 'OpenSCP\OpenSCP.exe'
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "OpenSCP exited at start with $($app.ExitCode)." }
          Stop-Process -Id $app.Id -Force
          $remove = Start-Process -FilePath msiexec.exe -Wait -PassThru `
            -ArgumentList '/x', "`"$msi`"", '/qn', '/norestart'
          if ($remove.ExitCode -ne 0) { throw "Removing the MSI exited with $($remove.ExitCode)." }
          if (Test-Path $exe) { throw 'Removing the MSI left OpenSCP behind.' }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: |
            dist/OpenSCP-*-x64-setup.exe
            dist/OpenSCP-*-x64-setup.exe.sha256
            dist/OpenSCP-*-x64.msi
            dist/OpenSCP-*-x64.msi.sha256
          if-no-files-found: error

  publish-assets:
    name: Upload assets to release
    # sign-macos-updates is skipped when Sparkle signing is not configured.
    if: >-
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.verify-source.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-windows.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.sign-macos-updates.result)
    needs:
      - verify-source
      - build-macos
      - sign-macos-updates
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.verify-source.outputs.tag_name }}

      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets

      - name: Show artifact tree
        run: |
          find release-assets -type f | sort

      - name: Sign the AppImage and Windows update manifest when configured
        env:
          OPENSCP_UPDATE_PRIVATE_KEY: ${{ secrets.OPENSCP_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$OPENSCP_UPDATE_PUBLIC_KEY" && -z "$OPENSCP_UPDATE_PRIVATE_KEY" ]]; then
            echo "Update signing is not configured; AppImage and Windows updates remain manual."
          else
            [[ -n "$OPENSCP_UPDATE_PUBLIC_KEY" && -n "$OPENSCP_UPDATE_PRIVATE_KEY" ]] || {
              echo "Both update signing keys must be configured."
              exit 1
            }
            python3 scripts/release/update-manifest.py \
              --assets release-assets \
              --version "${{ needs.verify-source.outputs.version }}" \
              --output release-assets/updates
          fi

      - name: Select release files and build SHA256SUMS.txt
        run: |
          set -euo pipefail
          version="${{ needs.verify-source.outputs.version }}"
          for arch in x86_64 aarch64; do
            appimage="release-assets/linux-${arch}/OpenSCP-${version}-${arch}.AppImage"
            [[ -s "$appimage" && -s "${appimage}.zsync" ]] || {
              echo "Missing AppImage or zsync file for ${arch}"
              exit 1
            }
          done
          for package in "OpenSCP-${version}-x64-setup.exe" "OpenSCP-${version}-x64.msi"; do
            [[ -s "release-assets/windows-x64/${package}" ]] || {
              echo "Missing Windows package ${package}"
              exit 1
            }
          done
          # Per-file .sha256 sidecars are replaced by one combined list, and
          # the snap is kept out of the release: sideloading it needs
          # --dangerous plus manual interface connections, so it belongs in
          # the store rather than on the download page. It stays available
          # as a workflow artifact for store submission.
          find release-assets -type f \
            ! -name '*.sha256' ! -name '*.snap' | sort > publish-files.txt
          if [[ ! -s publish-files.txt ]]; then
            echo "No publishable artifacts found."
            exit 1
          fi
          : > SHA256SUMS.txt
          while IFS= read -r file; do
            printf '%s  %s\n' \
              "$(sha256sum "$file" | awk '{print $1}')" \
              "$(basename "$file")" >> SHA256SUMS.txt
          done < publish-files.txt
          sort -k2 -o SHA256SUMS.txt SHA256SUMS.txt
          echo SHA256SUMS.txt >> publish-files.txt
          cat SHA256SUMS.txt

      # Each listed file gets a signed provenance record that
      # `gh attestation verify` checks without trusting this release page.
      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: SHA256SUMS.txt

      - name: Generate draft release notes
        run: |
          set -euo pipefail
          tag="${{ needs.verify-source.outputs.tag_name }}"
          version="${{ needs.verify-source.outputs.version }}"
          bash ./scripts/release/release-notes.sh \
            --tag "$tag" \
            --version "$version" \
            --repo "${{ github.repository }}" \
            --output "$PWD/release-notes.md"
          sed -n '1,120p' "$PWD/release-notes.md"

      - name: Upload artifacts to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.verify-source.outputs.tag_name }}"
          commit="${{ needs.verify-source.outputs.tag_commit }}"
          title="$tag"
          notes_file="$PWD/release-notes.md"
          mapfile -t files < publish-files.txt
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No files found to upload."
            exit 1
          fi

          # Builds are not bit-for-bit reproducible, so assets already
          # uploaded are never replaced: their checksums may have been
          # verified, and SHA256SUMS.txt must describe the files beside it.
          if gh release view "$tag" --repo "${{ github.repository }}" \
              >/dev/null 2>&1; then
            release_state="$(gh release view "$tag" \
              --repo "${{ github.repository }}" \
              --json isDraft,assets \
              --jq '"\(.isDraft) \(.assets | length)"')"
            read -r is_draft asset_count <<<"$release_state"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release ${tag} is already published; its assets are not replaced."
              exit 1
            fi
            if [[ "$asset_count" -gt 0 ]]; then
              echo "::error::Draft release ${tag} already has ${asset_count} asset(s). Delete them, or the draft, and re-run this job."
              exit 1
            fi
            # The draft's notes may have been edited by hand, so they stay.
          else
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --target "$commit" \
              --title "$title" \
              --draft \
              --notes-file "$notes_file"
          fi

          gh release upload "$tag" "${files[@]}" --repo "${{ github.repository }}"

      # After the upload, so that a problem here never holds the release back.
      - name: Write the winget manifests
        run: |
          python3 scripts/release/winget-manifests.py \
            --assets release-assets \
            --version "${{ needs.verify-source.outputs.version }}" \
            --output winget-manifests

      - name: Keep the winget manifests for submission
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: winget-manifests/
          if-no-files-found: error
