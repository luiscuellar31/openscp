name: Release Artifacts (Tag Push to Draft Release)

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OPENSCP_QT_VERSION: "6.8.3"

jobs:
  verify-tag:
    name: Verify Tag (main + version)
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      tag_commit: ${{ steps.meta.outputs.tag_commit }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Validate tag, branch ancestry, and version
        id: meta
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid tag format: '$tag' (expected: vX.Y.Z)"
            exit 1
          fi

          git fetch --no-tags origin main
          commit="$(git rev-list -n1 "$tag")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "Tag commit is not contained in origin/main: $commit"
            exit 1
          fi

          version="$(sed -n 's/^project(.*VERSION[[:space:]]*\([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n1)"
          if [[ -z "$version" ]]; then
            echo "Could not detect project version from CMakeLists.txt"
            exit 1
          fi
          snap_version="$(sed -n 's/^version:[[:space:]]*"\([0-9][0-9.]*\)"[[:space:]]*$/\1/p' packaging/snap/snapcraft.yaml | head -n1)"
          if [[ "$snap_version" != "$version" ]]; then
            echo "Version source mismatch: CMake=${version}, Snap=${snap_version:-missing}"
            exit 1
          fi
          if [[ "v${version}" != "$tag" ]]; then
            echo "Tag/version mismatch: tag=${tag}, project=v${version}"
            exit 1
          fi

          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"
          echo "tag_commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs:
      - verify-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            minimum_macos: "12.0"
          - runner: macos-15-intel
            arch: x86_64
            minimum_macos: "12.0"

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.verify-tag.outputs.tag_name }}

      - name: Install pinned Qt release SDK
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.OPENSCP_QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: "qtsvg qttools"
          cache: true
          aqtversion: "==3.3.0"
          py7zrversion: "==1.1.0"

      - name: Install macOS build tools
        run: |
          brew install pkg-config

      - name: Build pinned macOS dependencies for the deployment target
        env:
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.arch }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.minimum_macos }}
        run: |
          set -euo pipefail
          deps_prefix="$RUNNER_TEMP/openscp-release-deps"
          ./scripts/ci/build_macos_release_deps.sh "$deps_prefix"
          echo "OPENSCP_DEPENDENCY_PREFIX=$deps_prefix" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$deps_prefix" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$deps_prefix:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$deps_prefix/lib/pkgconfig:$deps_prefix/lib64/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Build macOS release artifacts
        run: |
          rm -rf dist build
          SKIP_CODESIGN=1 \
          SKIP_NOTARIZATION=1 \
          DO_ADHOC_SIGN=1 \
          MACDEPLOYQT_DISABLE_PLUGIN_SCAN=1 \
          PACKAGE_FORMATS=app,pkg,dmg \
          OPENSCP_ENFORCE_RECOMMENDED_QT_VERSION=ON \
          MINIMUM_SYSTEM_VERSION="${{ matrix.minimum_macos }}" \
          CMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
          ./scripts/package/macos.sh

      - name: Verify macOS bundle linkage
        run: |
          bash ./scripts/verify/macos-bundle.sh build/OpenSCP.app

      - name: Collect macOS artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          files=(
            dist/*-${{ matrix.arch }}-UNSIGNED.zip
            dist/*-${{ matrix.arch }}-UNSIGNED.zip.sha256
            dist/*-${{ matrix.arch }}-UNSIGNED.pkg
            dist/*-${{ matrix.arch }}-UNSIGNED.pkg.sha256
            dist/*-${{ matrix.arch }}-UNSIGNED.dmg
            dist/*-${{ matrix.arch }}-UNSIGNED.dmg.sha256
          )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No macOS artifacts found for arch ${{ matrix.arch }}"
            ls -la dist || true
            exit 1
          fi
          cp "${files[@]}" out/
          ls -lah out

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.arch_name }})
    needs:
      - verify-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch_name: x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
          - runner: ubuntu-24.04-arm
            arch_name: aarch64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.verify-tag.outputs.tag_name }}

      - name: Install pinned Qt release SDK
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.OPENSCP_QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: "qtsvg qttools"
          cache: true
          aqtversion: "==3.3.0"
          py7zrversion: "==1.1.0"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config curl file \
            libssh2-1-dev libssl-dev libcurl4-openssl-dev libtinyxml2-dev libsecret-1-dev \
            libgl1-mesa-dev \
            flatpak flatpak-builder \
            squashfs-tools

      - name: Install AppImage tools
        run: |
          set -euo pipefail
          # Digests come from GitHub's release-asset metadata and were reviewed
          # on 2026-07-29. An upstream update must be reviewed explicitly.
          arch="$(uname -m)"
          case "$arch" in
            x86_64)
              appimg_arch="x86_64"
              linuxdeploy_sha="e87ee0815d109282fdda73e34c2361d64d02b0ffaea3674b18f1fd1f6a687dcf"
              qt_plugin_sha="be1b7e166bf9975cfb694ebe6759ba40502ffc6196440d3e64aa90c4dbd67e9f"
              appimagetool_sha="a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0"
              ;;
            aarch64|arm64)
              appimg_arch="aarch64"
              linuxdeploy_sha="650ed1d045a09ab87855be1963f4f56ac7cf6defb6b2e2f4af0a3225f3d2d803"
              qt_plugin_sha="5525e6c49c3c774c02b8864d2acc2ae4c5c0ccc3327f7dce626deaa36348e5c6"
              appimagetool_sha="1b00524ba8c6b678dc15ef88a5c25ec24def36cdfc7e3abb32ddcd068e8007fe"
              ;;
            *)
              echo "Unsupported Linux arch for AppImage tools: $arch"
              exit 1
              ;;
          esac

          mkdir -p "$HOME/.local/bin"
          curl -fL "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${appimg_arch}.AppImage" \
            -o "$HOME/.local/bin/linuxdeploy"
          curl -fL "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${appimg_arch}.AppImage" \
            -o "$HOME/.local/bin/linuxdeploy-plugin-qt"
          curl -fL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${appimg_arch}.AppImage" \
            -o "$HOME/.local/bin/appimagetool"
          echo "${linuxdeploy_sha}  $HOME/.local/bin/linuxdeploy" | sha256sum --check --strict
          echo "${qt_plugin_sha}  $HOME/.local/bin/linuxdeploy-plugin-qt" | sha256sum --check --strict
          echo "${appimagetool_sha}  $HOME/.local/bin/appimagetool" | sha256sum --check --strict
          chmod +x "$HOME/.local/bin/linuxdeploy" \
                   "$HOME/.local/bin/linuxdeploy-plugin-qt" \
                   "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Snapcraft
        run: |
          if ! command -v snap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y snapd
            sudo systemctl start snapd.socket || true
            sudo systemctl start snapd || true
          fi
          if snap list snapcraft >/dev/null 2>&1; then
            sudo snap refresh snapcraft || true
          else
            sudo snap install snapcraft --classic
          fi

      - name: Setup Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build AppImage (glibc 2.28 baseline)
        if: matrix.arch_name == 'x86_64'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          OPENSCP_ENFORCE_RECOMMENDED_QT_VERSION: "ON"
        run: |
          set -euo pipefail
          rm -rf dist build build-appimage
          docker build --platform linux/amd64 \
            --tag openscp-appimage-glibc228 \
            --file packaging/linux/appimage-glibc228.Dockerfile \
            packaging/linux
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$QT_ROOT_DIR:$QT_ROOT_DIR:ro" \
            --volume "$HOME/.local/bin:$HOME/.local/bin:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            --env APPIMAGE_EXTRACT_AND_RUN=1 \
            --env OPENSCP_ENFORCE_RECOMMENDED_QT_VERSION=ON \
            --env OPENSCP_MAX_GLIBC_VERSION=2.28 \
            --env "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH:-}" \
            --env "Qt6_DIR=${Qt6_DIR:-}" \
            --env "PATH=$QT_ROOT_DIR/bin:$HOME/.local/bin:/opt/rh/gcc-toolset-13/root/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            openscp-appimage-glibc228 \
            ./scripts/package/appimage.sh
          sudo chown -R "$(id -u):$(id -g)" build-appimage dist

      - name: Build AppImage (Ubuntu 24.04 arm64 baseline)
        if: matrix.arch_name == 'aarch64'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          OPENSCP_ENFORCE_RECOMMENDED_QT_VERSION: "ON"
          OPENSCP_MAX_GLIBC_VERSION: "2.39"
        run: |
          rm -rf dist build build-appimage
          ./scripts/package/appimage.sh

      - name: Build Snap
        run: |
          sudo env "PATH=$PATH" ./scripts/package/snap.sh --destructive-mode

      - name: Build Flatpak
        run: |
          rm -rf dist/flatpak
          ./scripts/package/flatpak.sh --user --install-deps-from=flathub

      - name: Collect Linux artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          arch="$(uname -m)"

          shopt -s nullglob
          appimage_files=(dist/*.AppImage dist/*.AppImage.sha256)
          snap_files=(packaging/snap/*.snap)
          if [[ ${#appimage_files[@]} -gt 0 ]]; then
            cp "${appimage_files[@]}" out/
          fi
          if [[ ${#snap_files[@]} -gt 0 ]]; then
            cp "${snap_files[@]}" out/
          fi

          if [[ -f dist/OpenSCP.flatpak ]]; then
            mv dist/OpenSCP.flatpak "out/OpenSCP-${arch}.flatpak"
          fi

          if ! compgen -G "out/*" > /dev/null; then
            echo "No Linux artifacts produced."
            ls -la dist || true
            ls -la packaging/snap || true
            exit 1
          fi

          for f in out/*; do
            [[ "$f" == *.sha256 ]] && continue
            sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
          done

          ls -lah out

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch_name }}
          path: out/*
          if-no-files-found: error

  publish-assets:
    name: Upload assets to release
    needs:
      - verify-tag
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.verify-tag.outputs.tag_name }}

      - name: Download built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets

      - name: Show artifact tree
        run: |
          find release-assets -type f | sort

      - name: Generate draft release notes
        run: |
          set -euo pipefail
          tag="${{ needs.verify-tag.outputs.tag_name }}"
          version="${{ needs.verify-tag.outputs.version }}"
          bash ./scripts/release/release-notes.sh \
            --tag "$tag" \
            --version "$version" \
            --repo "${{ github.repository }}" \
            --output "$PWD/release-notes.md"
          sed -n '1,120p' "$PWD/release-notes.md"

      - name: Upload artifacts to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.verify-tag.outputs.tag_name }}"
          version="${{ needs.verify-tag.outputs.version }}"
          commit="${{ needs.verify-tag.outputs.tag_commit }}"
          title="OpenSCP v${version}"
          notes_file="$PWD/release-notes.md"
          mapfile -t files < <(find release-assets -type f | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No files found to upload."
            exit 1
          fi

          if gh release view "$tag" --repo "${{ github.repository }}" \
              >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" \
              --repo "${{ github.repository }}" \
              --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" == "true" ]]; then
              gh release edit "$tag" \
                --repo "${{ github.repository }}" \
                --title "$title" \
                --notes-file "$notes_file"
            else
              echo "Release for ${tag} already exists and is not a draft."
            fi
          else
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --target "$commit" \
              --title "$title" \
              --draft \
              --notes-file "$notes_file"
          fi

          gh release upload "$tag" "${files[@]}" --clobber --repo "${{ github.repository }}"
