name: Protocol Integration and Sanitizers

on:
  push:
    branches:
      - dev
      - backup29ago
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-ssh-services:
    name: SFTP and SCP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and SSH service dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cmake ninja-build netcat-openbsd openssh-server pkg-config \
            libssh2-1-dev libssl-dev libcurl4-openssl-dev libtinyxml2-dev \
            qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools libgl1-mesa-dev

      - name: Start isolated SSH service
        run: |
          set -euo pipefail
          sudo install -d -m 755 /run/sshd
          sudo ssh-keygen -A

          sudo useradd --create-home --shell /bin/bash openscp_it || true
          sudo usermod -U openscp_it || true
          sudo passwd -d openscp_it || true
          sudo chage -E -1 openscp_it || true

          ssh-keygen -t ed25519 -N "" \
            -f /tmp/openscp_it_linux_ed25519 -q
          sudo install -d -o openscp_it -g openscp_it -m 700 \
            /home/openscp_it/.ssh
          sudo install -o openscp_it -g openscp_it -m 600 \
            /tmp/openscp_it_linux_ed25519.pub \
            /home/openscp_it/.ssh/authorized_keys
          sudo install -d -o openscp_it -g openscp_it -m 700 \
            /home/openscp_it/upload

          sudo tee /tmp/openscp_sshd_config >/dev/null <<'EOF'
          Port 2222
          ListenAddress 127.0.0.1
          Protocol 2
          HostKey /etc/ssh/ssh_host_ed25519_key
          HostKey /etc/ssh/ssh_host_rsa_key
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          UsePAM no
          PermitRootLogin no
          AllowUsers openscp_it
          AuthorizedKeysFile .ssh/authorized_keys
          Subsystem sftp internal-sftp
          PidFile /tmp/openscp_sshd.pid
          LogLevel VERBOSE
          PrintMotd no
          UseDNS no
          EOF

          sudo /usr/sbin/sshd -t -f /tmp/openscp_sshd_config
          sudo /usr/sbin/sshd -f /tmp/openscp_sshd_config \
            -E /tmp/openscp_sshd.log

          for _ in {1..20}; do
            if nc -z 127.0.0.1 2222; then
              exit 0
            fi
            sleep 1
          done
          sudo cat /tmp/openscp_sshd.log || true
          exit 1

      - name: Configure SSH integration build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSCP_BUILD_TESTS=ON \
            -DOPENSCP_WERROR=ON

      - name: Build SFTP and SCP integration binaries
        run: |
          cmake --build build --parallel --target \
            openscp_sftp_integration_tests \
            openscp_scp_integration_tests 2>&1 | \
            tee /tmp/openscp-ssh-build.log

      - name: Report SSH build diagnostics
        if: failure()
        run: |
          grep -E -i \
            'error:|fatal:|undefined reference|no rule to make target' \
            /tmp/openscp-ssh-build.log | tail -20 | \
            while IFS= read -r line; do
              echo "::error title=SSH integration build::${line}"
            done

      - name: Run SFTP and SCP integration binaries directly
        env:
          OPENSCP_IT_SFTP_HOST: 127.0.0.1
          OPENSCP_IT_SFTP_PORT: "2222"
          OPENSCP_IT_SFTP_USER: openscp_it
          OPENSCP_IT_SFTP_KEY: /tmp/openscp_it_linux_ed25519
          OPENSCP_IT_REMOTE_BASE: /home/openscp_it/upload
        run: |
          ./build/tests/openscp_sftp_integration_tests
          ./build/tests/openscp_scp_integration_tests

      - name: Make SSH service log readable after failure
        if: failure()
        run: sudo chmod a+r /tmp/openscp_sshd.log || true

      - name: Upload SSH service log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-service-log
          path: /tmp/openscp_sshd.log
          if-no-files-found: ignore

  real-protocol-services:
    name: FTP, FTPS, and WebDAV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENSCP_PROTOCOL_IT_STATE_DIR: /tmp/openscp-protocol-it

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and protocol service dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            apache2 apache2-utils curl netcat-openbsd openssl shellcheck vsftpd \
            cmake ninja-build pkg-config \
            libssh2-1-dev libssl-dev libcurl4-openssl-dev libtinyxml2-dev \
            qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools libgl1-mesa-dev

      - name: Validate service scripts
        run: |
          bash -n scripts/ci/setup_protocol_services.sh
          bash -n scripts/ci/run_protocol_integration.sh
          shellcheck scripts/ci/setup_protocol_services.sh
          shellcheck scripts/ci/run_protocol_integration.sh

      - name: Configure protocol integration build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSCP_BUILD_TESTS=ON \
            -DOPENSCP_ENABLE_FTP_BACKEND=ON \
            -DOPENSCP_ENABLE_WEBDAV_BACKEND=ON

      - name: Build protocol integration binaries
        run: |
          cmake --build build --parallel --target \
            openscp_ftp_integration_tests \
            openscp_ftps_integration_tests \
            openscp_webdav_integration_tests

      - name: Start real protocol services
        run: |
          ./scripts/ci/setup_protocol_services.sh 2>&1 | \
            tee /tmp/openscp-protocol-setup.log

      - name: Report protocol service diagnostics
        if: failure()
        run: |
          grep -E -i 'error|failed|fatal|denied|address already in use' \
            /tmp/openscp-protocol-setup.log | tail -20 | \
            while IFS= read -r line; do
              echo "::error title=Protocol service setup::${line}"
            done

      - name: Run protocol integration binaries directly
        run: ./scripts/ci/run_protocol_integration.sh build

      - name: Make service logs readable after failure
        if: failure()
        run: sudo chmod -R a+rX /tmp/openscp-protocol-it/logs || true

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-service-logs
          path: /tmp/openscp-protocol-it/logs
          if-no-files-found: ignore

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            id: asan-ubsan
            flags: address,undefined
          - name: TSan
            id: tsan
            flags: thread

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sanitizer build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            clang cmake ninja-build pkg-config \
            libssh2-1-dev libssl-dev libcurl4-openssl-dev libtinyxml2-dev \
            qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools libgl1-mesa-dev

      - name: Configure instrumented build
        env:
          CC: clang
          CXX: clang++
          SANITIZERS: ${{ matrix.flags }}
        run: |
          SANITIZER_FLAGS="-fsanitize=${SANITIZERS} -fno-omit-frame-pointer"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DOPENSCP_BUILD_TESTS=ON \
            "-DCMAKE_C_FLAGS=${SANITIZER_FLAGS}" \
            "-DCMAKE_CXX_FLAGS=${SANITIZER_FLAGS}" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=${SANITIZERS}" \
            "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=${SANITIZERS}"

      - name: Build instrumented app and tests
        run: |
          cmake --build build --parallel 2>&1 | \
            tee /tmp/openscp-sanitizer-build.log

      - name: Report sanitizer build diagnostics
        if: failure()
        run: |
          grep -E -i \
            'error:|fatal:|undefined reference|no rule to make target' \
            /tmp/openscp-sanitizer-build.log | tail -20 | \
            while IFS= read -r line; do
              echo "::error title=Sanitizer build::${line}"
            done

      - name: Test with ASan and UBSan
        if: matrix.id == 'asan-ubsan'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_init_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure \
            -LE integration --timeout 180

      - name: Explain TSan coverage boundary
        if: matrix.id == 'tsan'
        run: |
          echo "::notice::OpenSCP and its Qt event-loop tests are TSan-instrumented. Ubuntu's prebuilt Qt shared libraries are not rebuilt with TSan, so this job cannot diagnose races wholly internal to Qt."

      - name: Test with TSan
        if: matrix.id == 'tsan'
        env:
          QT_QPA_PLATFORM: offscreen
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:history_size=7
        run: |
          ctest --test-dir build --output-on-failure \
            -LE integration --timeout 180
