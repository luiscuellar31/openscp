name: Nightly Quality

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the running checks moot.
concurrency:
  group: nightly-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  listing-fuzzers:
    if: github.event_name != 'pull_request'
    name: Listing parser fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libclang-rt-18-dev \
            libssh2-1-dev libssl-dev libcurl4-openssl-dev libtinyxml2-dev \
            qt6-base-dev libqt6svg6-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools libgl1-mesa-dev

      - name: Configure and build fuzzers
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DOPENSCP_BUILD_FUZZERS=ON
          cmake --build build-fuzz --target \
            openscp_ftp_listing_fuzzer openscp_webdav_listing_fuzzer

      - name: Run bounded parser fuzzing
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mkdir -p build-fuzz/corpus/ftp build-fuzz/corpus/webdav
          ./build-fuzz/fuzz/openscp_ftp_listing_fuzzer \
            build-fuzz/corpus/ftp fuzz/corpus/ftp \
            -max_total_time=30 -timeout=5 -rss_limit_mb=2048
          ./build-fuzz/fuzz/openscp_webdav_listing_fuzzer \
            build-fuzz/corpus/webdav fuzz/corpus/webdav \
            -max_total_time=30 -timeout=5 -rss_limit_mb=2048

  # ASan, UBSan and TSan run in protocol-integration.yml, which stops at the
  # first UBSan report.

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install analysis tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-format-17 clang-tidy-17 cmake ninja-build pkg-config cppcheck shellcheck \
            libssh2-1-dev libssl-dev libcurl4-openssl-dev libtinyxml2-dev libsecret-1-dev \
            qt6-base-dev libqt6svg6-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools libgl1-mesa-dev

      - name: Check C++ formatting
        run: ./scripts/checks/cpp-quality.sh --format

      - name: Check shell scripts
        run: ./scripts/checks/shell-quality.sh

      - name: Configure compilation database
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-analysis -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DOPENSCP_BUILD_TESTS=ON \
            -DOPENSCP_WERROR=ON

      - name: Run conservative clang-tidy checks
        run: ./scripts/checks/cpp-quality.sh --tidy --build-dir build-analysis

      - name: Run cppcheck
        run: ./scripts/checks/cpp-quality.sh --cppcheck
