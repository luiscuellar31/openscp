version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Changes reach main through dev, like the rest of the work.
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Moves vcpkg.json's builtin-baseline, which pins the Windows libraries;
  # the Windows CI jobs fetch vcpkg at that commit. OpenSSL is pinned apart,
  # in vcpkg-ports/openssl, and pinned-deps.yml proposes its updates.
  - package-ecosystem: "vcpkg"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
